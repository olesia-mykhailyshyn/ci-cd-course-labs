services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PARTNER_URL: http://partner:8080
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_healthy
    networks:
      - public
      - private

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - private

  partner:
    image: wiremock/wiremock:3.6.0
    volumes:
      - ./partner/mappings:/home/wiremock/mappings:ro
    networks:
      - private

networks:
  public:
  private:
    internal: true

volumes:
  db-data:
