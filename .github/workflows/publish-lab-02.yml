name: publish-lab-02

on:
  push:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/catshop
  TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-02/requirements*.txt
      - name: Install dependencies
        working-directory: lab-02
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the suite
        working-directory: lab-02
        run: python -m pytest tests -q

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$TAG" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$IMAGE:$TAG" \
            lab-02
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish to GHCR
        run: |
          docker push "$IMAGE:$TAG"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
